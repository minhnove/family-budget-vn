name: CI

on:
  pull_request:
  push:
    branches: [main]

# Chỉ quyền đọc: code từ Pull Request của người ngoài không thể sửa repo hay đọc secret
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kiểm tra tự động (dữ liệu bộ nhớ + Telegram giả lập)
        run: npm test
      - name: Quét bí mật (key, token, file .env)
        run: npm run check
